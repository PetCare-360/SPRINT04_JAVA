<!doctype html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Recomendações do veterinário')}"></head>
<body>
	<header th:replace="~{fragmentos :: topbar}"></header>
	<nav th:replace="~{fragmentos :: navVet}"></nav>

	<main>
		<h1 th:text="#{ui.recomendacoes}">Recomendações</h1>
		<form th:action="@{/recommendations/form}" method="post" th:if="${!#lists.isEmpty(linkedPets)}">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<p>
				<label for="petId" th:text="#{ui.pet.vinculado}">Pet vinculado</label><br>
				<select id="petId" name="petId" required>
					<option value="" th:text="#{ui.option.selecione}">Selecione</option>
					<option th:each="link : ${linkedPets}" th:value="${link.pet.id}"
							th:text="${link.pet.name} + ' - tutor ' + ${link.pet.user.name}"></option>
				</select>
			</p>
			<p><input type="text" name="title" placeholder="Título" th:placeholder="#{ui.titulo}" maxlength="120" required></p>
			<p>
				<select name="priority" required>
					<option value="LOW" th:text="#{ui.option.baixa}">Baixa</option>
					<option value="NORMAL" selected th:text="#{ui.option.normal}">Normal</option>
					<option value="HIGH" th:text="#{ui.option.alta}">Alta</option>
				</select>
			</p>
			<p><textarea name="instructions" placeholder="Orientações" th:placeholder="#{ui.orientacoes}" maxlength="1000" required></textarea></p>
			<button type="submit" th:text="#{ui.enviar.recomendacao}">Enviar recomendação</button>
		</form>

		<h2 th:text="#{ui.enviadas}">Enviadas</h2>
		<p th:if="${#lists.isEmpty(recommendations)}" th:text="#{ui.nenhuma.recomendacao}">Nenhuma recomendação.</p>
		<table border="1" cellpadding="6" th:if="${!#lists.isEmpty(recommendations)}">
			<thead>
				<tr>
					<th th:text="#{ui.pet}">Pet</th>
					<th th:text="#{ui.tutor}">Tutor</th>
					<th th:text="#{ui.titulo}">Título</th>
					<th th:text="#{ui.prioridade}">Prioridade</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${recommendations}">
					<td th:text="${item.petName()}"></td>
					<td th:text="${item.tutorName()}"></td>
					<td th:text="${item.title()}"></td>
					<td th:text="${item.priority()}"></td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
