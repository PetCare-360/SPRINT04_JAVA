<!doctype html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Tutor')}"></head>
<body>
	<header th:replace="~{fragmentos :: topbar}"></header>
	<nav th:replace="~{fragmentos :: navTutor}"></nav>

	<main>
		<h1 th:text="#{ui.painel.do.tutor}">Painel do tutor</h1>
		<p th:text="#{ui.resumo.da.sua.area}">Resumo da sua área.</p>

		<table border="1" cellpadding="6">
			<thead>
				<tr>
					<th th:text="#{ui.pets}">Pets</th>
					<th th:text="#{ui.veterinarios.vinculados}">Veterinários vinculados</th>
					<th th:text="#{ui.mensagens}">Mensagens</th>
					<th th:text="#{ui.consultas}">Consultas</th>
					<th th:text="#{ui.recomendacoes}">Recomendações</th>
					<th th:text="#{ui.alertas}">Alertas</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td th:text="${petCount}"></td>
					<td th:text="${linkCount}"></td>
					<td th:text="${messageCount}"></td>
					<td th:text="${appointmentCount}"></td>
					<td th:text="${recommendationCount}"></td>
					<td th:text="${alertCount}"></td>
				</tr>
			</tbody>
		</table>

		<h2 th:text="#{ui.acoes.rapidas}">Ações rápidas</h2>
		<ul>
			<li><a th:href="@{/tutor/pets}" th:text="#{ui.ver.meus.pets}">Ver meus pets</a></li>
			<li><a th:href="@{/tutor/pets/novo}" th:text="#{ui.cadastrar.novo.pet}">Cadastrar novo pet</a></li>
			<li><a th:href="@{/tutor/veterinarios}" th:text="#{ui.conectar.pet.com.veterinario}">Conectar pet com veterinário</a></li>
			<li><a th:href="@{/tutor/mensagens}" th:text="#{ui.enviar.e.ler.mensagens}">Enviar e ler mensagens</a></li>
			<li><a th:href="@{/tutor/consultas}" th:text="#{ui.solicitar.e.ver.consultas}">Solicitar e ver consultas</a></li>
			<li><a th:href="@{/tutor/recomendacoes}" th:text="#{ui.ver.recomendacoes.recebidas}">Ver recomendações recebidas</a></li>
		</ul>
	</main>
</body>
</html>
