<!doctype html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Pets')}"></head>
<body>
	<header th:replace="~{fragmentos :: topbar}"></header>
	<nav th:replace="~{fragmentos :: navAdmin}"></nav>

	<main>
		<h1 th:text="#{ui.pets.e.tutores}">Pets e tutores</h1>
		<form method="get" th:action="@{/admin/pets}">
			<label for="active" th:text="#{ui.filtrar.por.status}">Filtrar por status</label>
			<select id="active" name="active">
				<option value="todos" th:selected="${selectedActive == null || selectedActive == 'todos'}" th:text="#{ui.option.todos}">Todos</option>
				<option value="ativos" th:selected="${selectedActive == 'ativos'}" th:text="#{ui.option.ativos}">Ativos</option>
				<option value="inativos" th:selected="${selectedActive == 'inativos'}" th:text="#{ui.option.inativos}">Inativos</option>
			</select>
			<button type="submit" th:text="#{ui.filtrar}">Filtrar</button>
		</form>

		<p th:if="${#lists.isEmpty(pets)}" th:text="#{ui.nenhum.pet.cadastrado}">Nenhum pet cadastrado.</p>
		<table border="1" cellpadding="6" th:if="${!#lists.isEmpty(pets)}">
			<thead>
				<tr>
					<th th:text="#{ui.id}">ID</th>
					<th th:text="#{ui.pet}">Pet</th>
					<th th:text="#{ui.especie}">Espécie</th>
					<th th:text="#{ui.tutor}">Tutor</th>
					<th th:text="#{ui.e.mail.do.tutor}">E-mail do tutor</th>
					<th th:text="#{ui.coleira}">Coleira</th>
					<th th:text="#{ui.ativo}">Ativo</th>
					<th th:text="#{ui.acoes}">Ações</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="pet : ${pets}">
					<td th:text="${pet.id}"></td>
					<td th:text="${pet.name}"></td>
					<td th:text="${pet.species}"></td>
					<td th:text="${pet.user.name}"></td>
					<td th:text="${pet.user.email}"></td>
					<td th:text="${pet.device != null ? pet.device.deviceCode : 'Sem coleira'}"></td>
					<td th:text="${pet.active}"></td>
					<td>
						<a th:href="@{/admin/pets/{id}(id=${pet.id})}" th:text="#{ui.detalhes}">Detalhes</a>
						<a th:href="@{/admin/pets/{id}/editar(id=${pet.id})}" th:text="#{ui.editar}">Editar</a>
						<form th:action="@{/pets/{id}/remover(id=${pet.id})}" method="post">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
							<button type="submit" th:text="#{ui.remover}">Remover</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
