<!doctype html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Cadastro')}"></head>
<body class="auth-page">
	<main class="login-panel">
		<form th:replace="~{fragmentos :: languageSwitch}"></form>
		<h1 th:text="#{auth.register.title}">Criar conta</h1>
		<p th:text="#{auth.register.intro}">Escolha se a conta será de tutor ou veterinário.</p>

		<form th:action="@{/register}" th:object="${registerRequest}" method="post" class="form-stack">
			<p class="form-error" th:if="${#fields.hasErrors('*')}" th:each="error : ${#fields.errors('*')}" th:text="${error}">Verifique os dados informados.</p>
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<label>
				<span th:text="#{auth.register.name}">Nome</span>
				<input type="text" th:field="*{name}" required maxlength="120">
			</label>
			<label>
				<span th:text="#{auth.login.email}">E-mail</span>
				<input type="email" th:field="*{email}" required maxlength="160" autocomplete="username">
			</label>
			<label>
				<span th:text="#{auth.login.password}">Senha</span>
				<input type="password" name="password" required minlength="6" maxlength="80" autocomplete="new-password">
			</label>
			<label>
				<span th:text="#{auth.register.role}">Tipo de conta</span>
				<select th:field="*{role}" required>
					<option value="ROLE_CLIENTE" th:text="#{auth.register.tutor}">Tutor</option>
					<option value="ROLE_VETERINARIO" th:text="#{auth.register.vet}">Veterinário</option>
				</select>
			</label>
			<button type="submit" th:text="#{auth.register.submit}">Cadastrar</button>
		</form>

		<p><a th:href="@{/login}" th:text="#{auth.register.back}">Voltar para login</a></p>
	</main>
</body>
</html>
