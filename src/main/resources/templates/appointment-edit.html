<!doctype html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Editar consulta')}"></head>
<body>
	<header th:replace="~{fragmentos :: topbar}"></header>
	<th:block th:replace="~{fragmentos :: navegacao}"></th:block>

	<main>
		<h1 th:text="#{ui.editar.consulta}">Editar consulta</h1>
		<p th:if="${appointmentError}" role="alert" th:text="${appointmentError}"></p>

		<p th:if="${#lists.isEmpty(linkedVeterinarians)}" th:text="#{ui.nenhum.vinculo.entre.pet.e.veterinario.disponivel.para.editar.consulta}">Nenhum vínculo entre pet e veterinário disponível para editar consulta.</p>

		<form th:action="@{/appointments/{id}/form(id=${appointment.id})}" method="post" th:if="${!#lists.isEmpty(linkedVeterinarians)}">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<p>
				<label for="appointmentKey" th:text="#{ui.pet.e.veterinario}">Pet e veterinário</label><br>
				<select id="appointmentKey" name="appointmentKey" required>
					<option value="" th:text="#{ui.option.selecione}">Selecione</option>
					<option th:each="link : ${linkedVeterinarians}"
							th:value="${link.pet.id} + ':' + ${link.veterinarian.id}"
							th:selected="${link.pet.id.equals(appointment.pet.id) && link.veterinarian.id.equals(appointment.veterinarian.id)}"
							th:text="${link.pet.name} + ' com ' + ${link.veterinarian.name}"></option>
				</select>
			</p>
			<p>
				<label for="scheduledAt" th:text="#{ui.data.e.hora}">Data e hora</label><br>
				<input id="scheduledAt" type="datetime-local" name="scheduledAt" th:value="${scheduledAtValue}" required>
			</p>
			<p>
				<label for="reason" th:text="#{ui.motivo}">Motivo</label><br>
				<input id="reason" type="text" name="reason" maxlength="255" th:value="${appointment.reason}" required>
			</p>
			<button type="submit" th:text="#{ui.salvar.consulta}">Salvar consulta</button>
		</form>

		<p>
			<a th:if="${isTutor}" th:href="@{/tutor/consultas}" th:text="#{ui.voltar.para.consultas}">Voltar para consultas</a>
			<a th:if="${isVet}" th:href="@{/vet/consultas}" th:text="#{ui.voltar.para.consultas}">Voltar para consultas</a>
			<a th:if="${isAdmin}" th:href="@{/admin/consultas}" th:text="#{ui.voltar.para.consultas}">Voltar para consultas</a>
		</p>
	</main>
</body>
</html>
