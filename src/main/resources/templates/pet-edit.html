<!doctype html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Editar pet')}"></head>
<body>
	<header th:replace="~{fragmentos :: topbar}"></header>
	<th:block th:replace="~{fragmentos :: navegacao}"></th:block>

	<main>
		<h1 th:text="#{ui.editar.pet}">Editar pet</h1>
		<form th:action="@{/pets/{id}/form(id=${pet.id})}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<table cellpadding="6">
				<tr>
					<td><label for="name" th:text="#{ui.nome.do.pet}">Nome do pet</label></td>
					<td><input id="name" type="text" name="name" maxlength="120" th:value="${pet.name}" required></td>
				</tr>
				<tr>
					<td><label for="age" th:text="#{ui.idade}">Idade</label></td>
					<td><input id="age" type="number" name="age" min="0" max="40" th:value="${pet.age}" required></td>
				</tr>
				<tr>
					<td><label for="weight" th:text="#{ui.peso}">Peso</label></td>
					<td><input id="weight" type="number" name="weight" min="0.10" max="200" step="0.01" th:value="${pet.weight}" required></td>
				</tr>
				<tr>
					<td><label for="breed" th:text="#{ui.raca}">Raça</label></td>
					<td><input id="breed" type="text" name="breed" maxlength="120" th:value="${pet.breed}" required></td>
				</tr>
				<tr>
					<td><label for="species" th:text="#{ui.especie}">Espécie</label></td>
					<td>
						<select id="species" name="species" required>
							<option value="DOG" th:selected="${pet.species == 'DOG'}" th:text="#{ui.option.cachorro}">Cachorro</option>
							<option value="CAT" th:selected="${pet.species == 'CAT'}" th:text="#{ui.option.gato}">Gato</option>
							<option value="OTHER" th:selected="${pet.species == 'OTHER'}" th:text="#{ui.option.outro}">Outro</option>
						</select>
					</td>
				</tr>
				<tr>
					<td><label for="deviceId" th:text="#{ui.codigo.da.coleira}">Código da coleira</label></td>
					<td>
						<input id="deviceId" type="text" name="deviceId" maxlength="80"
								th:value="${pet.device != null ? pet.device.deviceCode : ''}" required>
					</td>
				</tr>
			</table>
			<button type="submit" th:text="#{ui.salvar.alteracoes}">Salvar alterações</button>
		</form>

		<form th:action="@{/pets/{id}/remover(id=${pet.id})}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<button type="submit" th:text="#{ui.remover.pet}">Remover pet</button>
		</form>

		<p><a th:href="@{/dashboard}" th:text="#{ui.voltar.para.meu.painel}">Voltar para meu painel</a></p>
	</main>
</body>
</html>
